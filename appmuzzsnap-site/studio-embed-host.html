<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MuzzStudio · MuzzSnap Host</title>
  <style>
    html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
    iframe{border:0;width:100%;height:100%}
    .err{color:#f87171;font:14px Inter,system-ui;padding:24px}
  </style>
</head>
<body>
  <iframe id="f" allow="camera; microphone; display-capture; autoplay; fullscreen" allowfullscreen></iframe>
  <script>
  (async function () {
    var frame = document.getElementById('f');
    var studioUrl = '/streamingsoftware/MuzzStudio-LIVE/index.html?embed=muzzsnap';
    var polyUrl = '/muzzocial/js/muzz-electron-polyfill.js';
    var skinUrl = '/muzzocial/js/muzz-studio-embed.js';

    try {
      var html = await fetch(studioUrl).then(function (r) {
        if (!r.ok) throw new Error('Cannot load studio UI (' + r.status + ')');
        return r.text();
      });

      // Inject polyfill BEFORE any studio scripts; fix relative asset paths
      var inject =
        '<base href="/streamingsoftware/MuzzStudio-LIVE/">' +
        '<script src="' + polyUrl + '"><\/script>' +
        '<script>document.documentElement.classList.add("embed-muzzsnap");<\/script>';

      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, function (m) { return m + inject; });
      } else {
        html = inject + html;
      }

      // Ensure embed class on body tag if present
      html = html.replace(/<body([^>]*)>/i, '<body$1 class="embed-muzzsnap">');

      frame.srcdoc = html;

      frame.addEventListener('load', function () {
        function paint() {
          try {
            if (window.parent && window.parent.MuzzStudioEmbed) {
              window.parent.MuzzStudioEmbed.inject(frame);
            }
          } catch (e) {
            console.warn(e);
          }
        }
        paint();
        setTimeout(paint, 500);
        setTimeout(paint, 1500);
        setTimeout(paint, 3000);
      });
    } catch (e) {
      document.body.innerHTML = '<p class="err">' + (e.message || e) + '</p>';
    }
  })();
  </script>
</body>
</html>
