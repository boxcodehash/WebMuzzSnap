<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MuzzSnap Private</title>
  <link rel="icon" href="muzzsnap.jpg">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
  <script src="js/muzz-gate.js"></script>
  <style>
    :root{
      --bg:#181d23;
      --soft:#232a33;
      --line:rgba(255,255,255,.08);
      --red:#ff2a2a;
      --red-2:#b40000;
      --text:#f4f7fb;
      --muted:#95a0af;
      --green:#39ff14;
      --blue:#8ec5ff;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-right:env(safe-area-inset-right, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --safe-left:env(safe-area-inset-left, 0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#252b33 0%, #1b2027 100%);color:var(--text)}
    body{overflow:hidden;font-size:14px}
    .app{height:100dvh;display:grid;grid-template-columns:320px minmax(0,1fr)}
    .sidebar,.chat{min-height:0}
    .sidebar{background:rgba(10,13,17,.82);backdrop-filter:blur(10px);border-right:1px solid rgba(255,42,42,.14);padding:18px;display:flex;flex-direction:column;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(255,42,42,.18);border-radius:22px;background:linear-gradient(180deg,rgba(255,42,42,.06),rgba(255,42,42,.02))}
    .logo{width:46px;height:46px;border-radius:16px;object-fit:cover;box-shadow:0 0 20px rgba(255,42,42,.22)}
    .brand h1{margin:0;font-size:25px;letter-spacing:-1px;font-weight:900;font-style:italic}
    .brand h1 span{color:var(--red)}
    .card{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:22px;padding:14px}
    .section-title{font-size:11px;letter-spacing:.28em;color:#8c95a3;text-transform:uppercase;font-weight:800;margin:0 0 12px}
    .user-badge{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:rgba(255,42,42,.08);border:1px solid rgba(255,42,42,.16)}
    .avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#2a313b,#12171d);display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 auto}
    .avatar.red{background:linear-gradient(145deg,var(--red),var(--red-2))}
    .muted{color:var(--muted)}
    .small{font-size:11px}
    .contact-list{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:4px}
    .contact{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid transparent;background:rgba(255,255,255,.02);cursor:pointer;transition:.2s;width:100%;color:inherit;text-align:left}
    .contact:hover{background:rgba(255,255,255,.04)}
    .contact.active{background:rgba(255,42,42,.08);border-color:rgba(255,42,42,.18)}
    .status{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:inline-block;margin-right:8px;flex:0 0 auto}
    .side-actions{display:grid;gap:10px}
    .btn{border:none;border-radius:18px;padding:14px 16px;font-weight:800;cursor:pointer;transition:.2s}
    .btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text)}
    .chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:linear-gradient(180deg,rgba(16,20,25,.8),rgba(8,10,14,.9))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);flex:0 0 auto}
    .topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
    .topbar h2{margin:0;font-size:14px;letter-spacing:.16em;color:#ff6565;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pill{padding:7px 11px;border-radius:999px;background:rgba(255,42,42,.08);border:1px solid rgba(255,42,42,.18);font-size:11px;color:#ff9a9a;font-weight:700}
    .messages{flex:1;min-height:0;overflow:auto;padding:22px 22px calc(22px + var(--safe-bottom));display:flex;flex-direction:column;gap:14px}
    .msg-wrap{display:flex;gap:10px;align-items:flex-end;max-width:82%}
    .msg-wrap.me{align-self:flex-end;flex-direction:row-reverse}
    .bubble{padding:11px 13px;border-radius:18px;background:var(--soft);border:1px solid rgba(255,255,255,.05);line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.18);word-break:break-word;font-size:13.5px}
    .msg-wrap.me .bubble{background:linear-gradient(145deg,var(--red),var(--red-2));border-color:transparent}
    .meta{font-size:10px;color:var(--muted);margin:2px 6px}
    .composer{padding:16px 18px calc(16px + var(--safe-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.02);flex:0 0 auto}
    .composer-box{display:flex;gap:12px;align-items:flex-end;background:#0b1015;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:10px 10px 10px 16px}
    textarea{flex:1;resize:none;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:14px;line-height:1.4;min-height:24px;max-height:140px;padding:6px 0}
    .send{width:50px;height:50px;border-radius:16px;border:none;background:linear-gradient(145deg,var(--red),var(--red-2));color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto}
    .empty{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted)}
    .mobile-top{display:none;flex:0 0 auto}
    @media (max-width: 920px){
      .app{grid-template-columns:1fr;height:100dvh;padding:0}
      .sidebar{display:none}
      .chat{height:100dvh;min-height:0;border:none}
      .mobile-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) 10px calc(12px + var(--safe-left));border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
      .messages{padding:14px}
      .composer{padding:12px calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left))}
      .msg-wrap{max-width:92%}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="muzzsnap.jpg" alt="MuzzSnap" class="logo">
        <h1>MUZZ<span>SNAP</span></h1>
      </div>
      <div class="card">
        <p class="section-title">Private Access</p>
        <div class="user-badge">
          <div class="avatar red" id="meAvatar">M</div>
          <div>
            <div style="font-weight:800" id="meName">Node_User</div>
            <div class="muted small" id="meSubtext">10,000,000 MUZZ</div>
          </div>
        </div>
      </div>
      <div class="card" style="min-height:0;display:flex;flex-direction:column;flex:1">
        <p class="section-title">Conversations</p>
        <div class="contact-list" id="contactList"></div>
      </div>
      <div class="side-actions">
        <button class="btn ghost" onclick="window.location.href='chat.html'">← Back to Chat</button>
      </div>
    </aside>
    <section class="chat">
      <div class="mobile-top">
        <button class="btn ghost" style="padding:10px 12px;border-radius:14px" onclick="window.location.href='chat.html'">← Back</button>
        <img src="muzzsnap.jpg" alt="MuzzSnap" style="width:36px;height:36px;border-radius:12px;object-fit:cover">
      </div>
      <div class="topbar" id="chatHeader"></div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="composer-box">
          <textarea id="messageInput" placeholder="Write a private message..."></textarea>
          <button class="send" id="sendBtn">➤</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const MUZZ_TOKEN = '0xef3dAa5fDa8Ad7aabFF4658f1F78061fd626B8f0';
    const MUZZ_MIN_REQUIRED = 10000000;
    const ONLINE_TTL_MS = 45000;
    const ADMIN_WALLETS = [
      '0x208157b5ec396759e8754058108ecf53e32392ff',
      '0xfab5835ca14fb3f9f978c5e4d733734e6394e03f',
      '0x875c5a7794b601f273da58e3c1d10671d16130ec'
    ];
    const ERC20_ABI = [
      'function balanceOf(address) view returns (uint256)',
      'function decimals() view returns (uint8)'
    ];

    const fbConfig = {
      apiKey: atob('QUl6YVN5QWUxLUpmTmRlME5LSU1kRTdwaGZFWGxtOUphcVVIMGpZ'),
      authDomain: atob('cHVsc2FyaS5maXJlYmFzZWFwcC5jb20='),
      databaseURL: atob('aHR0cHM6Ly9wdWxzYXJpLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=='),
      projectId: atob('cHVsc2FyaQ=='),
      storageBucket: atob('cHVsc2FyaS5maXJlYmFzZXN0b3JhZ2UuYXBw'),
      messagingSenderId: atob('ODI0MzA2MzIxMjMz'),
      appId: atob('MTo4MjQzMDYzMjEyMzM6d2ViOjJjOWJmYTAyMTcwYTE3ZDU2MGI1NzA=')
    };

    if (!firebase.apps.length) firebase.initializeApp(fbConfig);
    const db = firebase.database();

    const meRaw = (window.muzzGate ? muzzGate.savedWallet() : '') || '';
    const meWallet = String(meRaw || '').trim().toLowerCase();
    const storedAdmin = sessionStorage.getItem('muzz_is_admin') === 'true';
    const isGuest = !meWallet || meWallet.startsWith('guest_');
    const isAdmin = storedAdmin || ADMIN_WALLETS.includes(meWallet);
    const meRole = meWallet === ADMIN_WALLETS[0] ? 'ryachu' : meWallet === ADMIN_WALLETS[1] ? 'itsuki' : meWallet === ADMIN_WALLETS[2] ? 'esteban' : 'user';
    const meName = isGuest ? meRaw.replace('guest_','') : (meRole === 'user' ? `Node_${meWallet.slice(-4) || 'User'}` : (meRole === 'ryachu' ? 'Ryachu' : meRole === 'itsuki' ? 'Itsuki' : 'Esteban'));
    const meIdentity = isGuest ? `guest_${meName}` : `wallet_${meWallet}`;

    let contacts = [];
    let activeWallet = null;
    let messages = [];
    let inboxUnsub = null;

    function escapeHtml(str){
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }
    function initials(text){ return (text || 'M').replace(/[^a-zA-Z0-9]/g,'').slice(0,1).toUpperCase() || 'M'; }
    function shortenWallet(wallet){ if(!wallet) return ''; return wallet.slice(0,6) + '...' + wallet.slice(-4); }
    function threadId(a,b){ return [String(a).toLowerCase(), String(b).toLowerCase()].sort().join('_'); }
    function isFresh(ts){ return Number(ts || 0) && (Date.now() - Number(ts) < ONLINE_TTL_MS); }
    function formatTime(ts){
      const d = new Date(Number(ts || Date.now()));
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    }

    async function validatePrivateAccess(){
      if(!/^0x[a-f0-9]{40}$/.test(meWallet)){
        muzzGate.clearWallet();
        window.location.href = 'login.html';
        return false;
      }
      sessionStorage.setItem('muzz_wallet_address', meWallet);
      try{
        const holding = await muzzGate.readMuzzBalance(meWallet);
        if(!holding.ok){
          alert('Insufficient MUZZ balance. You have ' + holding.formatted + ' MUZZ and the minimum is ' + holding.minimum + ' MUZZ.');
          window.location.href = 'chat.html';
          return false;
        }
        return true;
      }catch(err){
        console.error('Private validation failed:', err);
        alert('Your MUZZ balance could not be verified. Nothing was changed.');
        window.location.href = 'chat.html';
        return false;
      }
    }

    function renderMe(){
      document.getElementById('meName').textContent = meName || 'Node_User';
      document.getElementById('meAvatar').textContent = initials(meName || 'M');
      document.getElementById('meSubtext').textContent = '10,000,000 MUZZ verified';
    }

    function renderContacts(){
      const list = document.getElementById('contactList');
      list.innerHTML = '';
      if(!contacts.length){
        list.innerHTML = '<div class="muted small">No wallet contacts yet.</div>';
        return;
      }
      contacts.forEach(chat => {
        const row = document.createElement('button');
        row.className = 'contact' + (chat.wallet === activeWallet ? ' active' : '');
        row.innerHTML = `
          <div class="avatar">${escapeHtml(chat.avatar)}</div>
          <div style="min-width:0;flex:1;text-align:left">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
              <div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(chat.name)}</div>
              <div class="small muted">${chat.online ? 'online' : ''}</div>
            </div>
            <div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(chat.lastText || chat.subtitle || '')}</div>
          </div>
        `;
        row.onclick = () => openThread(chat.wallet);
        list.appendChild(row);
      });
    }

    function renderHeader(){
      const el = document.getElementById('chatHeader');
      const chat = contacts.find(c => c.wallet === activeWallet);
      if(!chat){
        el.innerHTML = `
          <div class="topbar-left">
            <div class="avatar">🛡️</div>
            <div style="min-width:0">
              <h2>PRIVATE</h2>
              <div class="small muted">Select a wallet conversation.</div>
            </div>
          </div>
          <div class="pill">10,000,000 MUZZ</div>
        `;
        return;
      }
      el.innerHTML = `
        <div class="topbar-left">
          <div class="avatar">${escapeHtml(chat.avatar)}</div>
          <div style="min-width:0">
            <h2>${escapeHtml(chat.name)}</h2>
            <div class="small muted"><span class="status" style="background:${chat.online ? 'var(--green)' : '#5f6b7a'};box-shadow:${chat.online ? '0 0 10px var(--green)' : 'none'}"></span>${chat.online ? 'Online' : 'Offline'} · ${escapeHtml(chat.subtitle)}</div>
          </div>
        </div>
        <div class="pill">PRIVATE</div>
      `;
    }

    function renderMessages(){
      const box = document.getElementById('messages');
      if(!activeWallet){
        if(!contacts.length){
          box.innerHTML = '<div class="empty">No wallet contacts yet.</div>';
          return;
        }
        box.innerHTML = contacts.map(chat => `
          <button class="contact" data-wallet="${escapeHtml(chat.wallet)}" style="max-width:100%">
            <div class="avatar">${escapeHtml(chat.avatar)}</div>
            <div style="min-width:0;flex:1;text-align:left">
              <div style="font-weight:800">${escapeHtml(chat.name)} ${chat.online ? '· online' : ''}</div>
              <div class="small muted">${escapeHtml(chat.subtitle)}</div>
            </div>
          </button>
        `).join('');
        box.querySelectorAll('[data-wallet]').forEach(btn => {
          btn.onclick = () => openThread(btn.getAttribute('data-wallet'));
        });
        return;
      }
      if(!messages.length){
        box.innerHTML = '<div class="empty">No messages yet. Say hello.</div>';
        return;
      }
      box.innerHTML = messages.map(msg => {
        const mine = String(msg.from || '').toLowerCase() === meWallet;
        const name = mine ? meName : (contacts.find(c => c.wallet === activeWallet) || {}).name || 'User';
        return `
          <div class="msg-wrap ${mine ? 'me' : ''}">
            <div class="avatar ${mine ? 'red' : ''}" style="width:36px;height:36px;border-radius:12px;font-size:14px">${escapeHtml(initials(name))}</div>
            <div>
              <div class="meta">${escapeHtml(name)} · ${escapeHtml(formatTime(msg.timestamp))}</div>
              <div class="bubble">${escapeHtml(msg.text || '')}</div>
            </div>
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    function render(){
      renderMe();
      renderContacts();
      renderHeader();
      renderMessages();
    }

    function openThread(wallet){
      activeWallet = wallet;
      if(inboxUnsub){ try{ inboxUnsub(); }catch(e){} }
      const ref = db.ref('privateInbox/' + threadId(meWallet, wallet) + '/messages').limitToLast(100);
      const handler = snap => {
        const val = snap.val() || {};
        const all = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a,b) => Number(a.timestamp||0) - Number(b.timestamp||0));
        messages = muzzGate.visible(all, Date.now());
        render();
      };
      ref.on('value', handler);
      inboxUnsub = () => ref.off('value', handler);
      render();
    }

    async function sendMessage(){
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if(!text || !activeWallet) return;
      try{
        const tid = threadId(meWallet, activeWallet);
        await db.ref('privateInbox/' + tid + '/messages').push({
          from: meWallet,
          to: activeWallet,
          username: meName,
          text,
          timestamp: Date.now()
        });
        const preview = { lastText: text, lastAt: Date.now() };
        await db.ref('privateIndex/' + meWallet + '/' + activeWallet).update(preview);
        await db.ref('privateIndex/' + activeWallet + '/' + meWallet).update(preview);
        input.value = '';
        autoResizeInput();
      }catch(err){
        console.error(err);
        alert('Could not send private message.');
      }
    }

    function mergeContacts(registry, statusMap, indexMap){
      const map = {};
      Object.values(registry || {}).forEach(entry => {
        const wallet = String(entry.wallet || '').toLowerCase();
        if(!wallet || wallet === meWallet) return;
        const identity = 'wallet_' + wallet;
        const live = statusMap[identity] || {};
        map[wallet] = {
          wallet,
          name: entry.role === 'ryachu' ? 'Ryachu' : entry.role === 'itsuki' ? 'Itsuki' : entry.role === 'esteban' ? 'Esteban' : (entry.username || ('Node_' + wallet.slice(-4))),
          avatar: entry.role === 'ryachu' ? '👑' : entry.role === 'itsuki' ? '💎' : entry.role === 'esteban' ? '🛡️' : '👤',
          subtitle: shortenWallet(wallet),
          lastText: '',
          lastAt: Number(entry.lastSeen || 0),
          online: isFresh(live.lastSeen || entry.lastSeen)
        };
      });
      Object.keys(indexMap || {}).forEach(wallet => {
        const w = String(wallet || '').toLowerCase();
        if(!w || w === meWallet) return;
        const idx = indexMap[wallet] || {};
        if(!map[w]){
          map[w] = {
            wallet: w,
            name: 'Node_' + w.slice(-4),
            avatar: '👤',
            subtitle: shortenWallet(w),
            lastText: idx.lastText || '',
            lastAt: Number(idx.lastAt || 0),
            online: false
          };
        } else {
          map[w].lastText = idx.lastText || map[w].lastText;
          map[w].lastAt = Number(idx.lastAt || map[w].lastAt || 0);
        }
      });
      contacts = Object.values(map).sort((a,b) => {
        if(a.online !== b.online) return a.online ? -1 : 1;
        return Number(b.lastAt||0) - Number(a.lastAt||0);
      });
      if(activeWallet && !contacts.some(c => c.wallet === activeWallet)){
        activeWallet = contacts[0] ? contacts[0].wallet : null;
      }
      render();
    }

    function startLiveData(){
      let registry = {};
      let statusMap = {};
      let indexMap = {};
      const refresh = () => mergeContacts(registry, statusMap, indexMap);

      db.ref('walletRegistry').on('value', snap => { registry = snap.val() || {}; refresh(); });
      db.ref('status').on('value', snap => { statusMap = snap.val() || {}; refresh(); });
      db.ref('privateIndex/' + meWallet).on('value', snap => { indexMap = snap.val() || {}; refresh(); });
      setInterval(refresh, 10000);
    }

    function markWalletPresence(){
      const statusRef = db.ref('status/' + meIdentity);
      const write = () => statusRef.set({
        uid: (firebase.auth().currentUser || {}).uid || null,
        username: meName,
        role: meRole,
        wallet: meWallet,
        identityKey: meIdentity,
        lastSeen: Date.now()
      });
      db.ref('.info/connected').on('value', snap => {
        if(snap.val() !== true) return;
        statusRef.onDisconnect().remove();
        db.ref('walletRegistry/' + meWallet + '/active').onDisconnect().set(false);
        write();
      });
      setInterval(write, 20000);
      db.ref('walletRegistry/' + meWallet).update({
        wallet: meWallet,
        username: meName,
        role: meRole,
        isAdmin,
        isWallet: true,
        lastLogin: firebase.database.ServerValue.TIMESTAMP,
        lastSeen: firebase.database.ServerValue.TIMESTAMP,
        active: true
      });
    }

    const privateInput = document.getElementById('messageInput');
    function autoResizeInput(){
      privateInput.style.height = '26px';
      privateInput.style.height = Math.min(privateInput.scrollHeight, 140) + 'px';
    }
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    privateInput.addEventListener('input', autoResizeInput);
    privateInput.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    (async function boot(){
      const allowed = await validatePrivateAccess();
      if(!allowed) return;
      try { await firebase.auth().signInAnonymously(); } catch (err) { console.error(err); }
      autoResizeInput();
      markWalletPresence();
      startLiveData();
      render();
    })();
  </script>
</body>
</html>
