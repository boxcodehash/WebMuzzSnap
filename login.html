<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MuzzSnap | Login</title>
    <meta name="theme-color" content="#050505">
    <link rel="icon" href="muzzsnap.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="muzz-names.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        if (window.top !== window.self) {
            window.top.location.replace(window.self.location.href);
        }
    </script>

    <style>
        :root {
            --red: #ff1a1a;
            --red-glow: rgba(255, 20, 20, 0.45);
            --bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .hidden { display: none !important; }

        .space {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 35%, rgba(120, 0, 0, 0.28), transparent 62%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 0, 0.08), transparent 45%),
                linear-gradient(180deg, #000 0%, #0a0000 55%, #050505 100%);
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255, 30, 30, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 30, 30, 0.06) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 75%);
            pointer-events: none;
        }

        .scan {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 3px
            );
            opacity: 0.35;
        }

        .stage {
            position: relative;
            z-index: 3;
            flex: 1;
            width: 100%;
            max-width: 420px;
            padding: 36px 22px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }

        .title-block { text-align: center; }

        .title-block h1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #cfcfcf 38%, #8a8a8a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 0 #1a1a1a) drop-shadow(0 8px 18px rgba(255, 0, 0, 0.25));
        }

        .status-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .led {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 8px var(--red), 0 0 18px var(--red-glow);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .status {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--red);
            text-shadow: 0 0 16px var(--red-glow);
        }

        #statusText {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.42);
        }

        .icon-bezel {
            position: relative;
            width: min(58vw, 188px);
            aspect-ratio: 1;
            padding: 10px;
            border-radius: 36px;
            background: linear-gradient(160deg, #5a5a5a 0%, #1c1c1c 22%, #0a0a0a 50%, #2a2a2a 78%, #111 100%);
            box-shadow:
                inset 0 2px 2px rgba(255, 255, 255, 0.35),
                inset 0 -6px 10px rgba(0, 0, 0, 0.75),
                0 2px 0 #777,
                0 6px 0 #1a1a1a,
                0 12px 0 #050505,
                0 18px 32px rgba(0, 0, 0, 0.75),
                0 0 50px rgba(255, 0, 0, 0.22);
            transform: perspective(900px) rotateX(6deg);
            cursor: pointer;
            border: 0;
        }

        .icon-bezel::before {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255, 40, 40, 0.45);
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.25), inset 0 0 18px rgba(255, 0, 0, 0.12);
            pointer-events: none;
        }

        .icon-bezel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 26px;
            display: block;
            pointer-events: none;
        }

        .icon-bezel:hover { filter: brightness(1.08); }
        .icon-bezel:active { transform: perspective(900px) rotateX(6deg) scale(0.97); }

        .loading-ui {
            position: absolute;
            inset: 10px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 26px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--red);
            animation: spin 0.9s linear infinite;
        }

        .panel {
            width: 100%;
            padding: 18px 16px 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -3px 0 rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 30, 30, 0.28),
                0 10px 24px rgba(0, 0, 0, 0.45);
        }

        .field {
            width: 100%;
            margin: 0 0 12px;
            padding: 13px 14px;
            border: 0;
            border-radius: 12px;
            outline: none;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(180deg, #141414, #0a0a0a);
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .field::placeholder { color: rgba(255, 255, 255, 0.28); }
        .field:focus {
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 30, 30, 0.7),
                0 0 18px rgba(255, 0, 0, 0.2);
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 18px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            border-radius: 14px;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #ff4a4a 0%, #e01010 38%, #9a0000 100%);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.38),
                inset 0 -3px 0 rgba(80, 0, 0, 0.55),
                0 3px 0 #5a0000,
                0 8px 0 #220000,
                0 14px 28px rgba(255, 0, 0, 0.28);
        }

        .btn-secondary {
            color: #f2f2f2;
            background: linear-gradient(180deg, #2a2a2a 0%, #141414 50%, #0a0a0a 100%);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.16),
                inset 0 -3px 0 rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 30, 30, 0.45),
                0 3px 0 #3a0000,
                0 8px 0 #110000;
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .btn:active {
            transform: translateY(4px);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.45), 0 1px 0 #220000;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: rgba(255, 255, 255, 0.28);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 30, 30, 0.4), transparent);
        }

        .error-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: rgba(80, 0, 0, 0.28);
            box-shadow: inset 0 0 0 1px rgba(255, 40, 40, 0.45);
        }

        .error-box p:first-child {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: var(--red);
            margin-bottom: 4px;
        }

        .error-box p:last-child {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.65);
        }

        footer {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 18px 16px 24px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.38);
        }

        footer span {
            color: var(--red);
            text-shadow: 0 0 10px var(--red-glow);
        }

        .sign-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
        }

        .sign-card {
            width: min(92vw, 360px);
            padding: 28px 22px 24px;
            border-radius: 22px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a, #0c0c0c);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 0 0 1px rgba(255,30,30,0.35),
                0 24px 50px rgba(0,0,0,0.55);
        }

        .sign-card .spinner {
            margin: 0 auto 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.12);
            border-top-color: var(--red);
            animation: spin 0.9s linear infinite;
        }

        .sign-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sign-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.62);
            line-height: 1.45;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.82); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .stage { gap: 18px; padding-top: 28px; }
            .icon-bezel { width: min(52vw, 168px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .led, .spinner { animation: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="space"></div>
    <div class="grid"></div>
    <div class="scan"></div>

    <main class="stage">
        <header class="title-block">
            <h1>
                <span class="brand">MuzzSnap</span>
                <span class="status-row">
                    <span class="led" aria-hidden="true"></span>
                    <span class="status">MuzzChat</span>
                </span>
            </h1>
        </header>

        <button type="button" id="btnConnect" class="icon-bezel" onclick="accessWithWallet()" aria-label="Connect wallet">
            <div id="loadingUI" class="loading-ui hidden">
                <div class="spinner"></div>
            </div>
            <img src="muzzsnap.jpg" alt="MuzzSnap">
        </button>

        <p id="statusText">Tap the logo to connect wallet</p>

        <div class="divider">or guest</div>

        <div class="panel">
            <input type="text" id="usernameInput" class="field" placeholder="Enter nickname" autocomplete="username" maxlength="32">
            <button type="button" class="btn btn-secondary" onclick="accessWithGuest()">Enter as Guest</button>
        </div>

        <div id="errorBox" class="error-box hidden">
            <p id="errorTitle"></p>
            <p id="errorDesc"></p>
        </div>
    </main>

    <div id="signOverlay" class="sign-overlay hidden">
        <div class="sign-card">
            <div class="spinner"></div>
            <h2 id="signStep">Connecting wallet</h2>
            <p>Approve the connection and signature in MetaMask, then return to this browser.</p>
        </div>
    </div>

    <footer>Powered by: <span>Ryashu &amp; Itzuki</span></footer>

    <script>
        const loadingUI = document.getElementById('loadingUI');
        const errorBox = document.getElementById('errorBox');
        const signOverlay = document.getElementById('signOverlay');
        const statusText = document.getElementById('statusText');
        const signStep = document.getElementById('signStep');

        let mmSdk = null;

        function setStep(text) {
            statusText.innerText = text;
            signStep.innerText = text;
        }

        function showSigning(show) {
            signOverlay.classList.toggle('hidden', !show);
            loadingUI.classList.toggle('hidden', !show);
        }

        function showError(title, desc) {
            showSigning(false);
            errorBox.classList.remove('hidden');
            document.getElementById('errorTitle').innerText = title;
            document.getElementById('errorDesc').innerText = desc;
        }

        function normalizeAddress(address) {
            return String(address || '').trim().toLowerCase();
        }

        function saveUserSession(address) {
            const normalizedAddress = normalizeAddress(address);
            const isAdmin = window.MuzzNames ? MuzzNames.isAdmin(normalizedAddress) : false;
            sessionStorage.setItem('muzz_wallet_address', normalizedAddress);
            sessionStorage.setItem('muzz_user_role', isAdmin ? 'admin' : 'user');
            sessionStorage.setItem('muzz_is_admin', isAdmin ? 'true' : 'false');
        }

        function discoverInjectedProvider() {
            return new Promise((resolve) => {
                const found = [];
                const onAnnounce = (event) => found.push(event.detail);
                window.addEventListener('eip6963:announceProvider', onAnnounce);
                window.dispatchEvent(new Event('eip6963:requestProvider'));
                setTimeout(() => {
                    window.removeEventListener('eip6963:announceProvider', onAnnounce);
                    const metamask = found.find((item) => {
                        const id = `${item.info?.rdns || ''} ${item.info?.name || ''}`.toLowerCase();
                        return id.includes('metamask');
                    });
                    resolve((metamask || found[0])?.provider || window.ethereum || null);
                }, 150);
            });
        }

        async function getWalletProvider() {
            const injected = await discoverInjectedProvider();
            if (injected) return injected;

            const mod = await import('https://esm.sh/@metamask/sdk@0.32.1');
            const MetaMaskSDK = mod.MetaMaskSDK || mod.default;
            if (!mmSdk) {
                mmSdk = new MetaMaskSDK({
                    dappMetadata: {
                        name: 'MuzzSnap',
                        url: window.location.origin,
                        iconUrl: new URL('muzzsnap.jpg', window.location.href).href
                    },
                    useDeeplink: true,
                    checkInstallationImmediately: false,
                    enableAnalytics: false
                });
                if (typeof mmSdk.init === 'function') await mmSdk.init();
            }
            if (typeof mmSdk.connect === 'function') {
                await mmSdk.connect();
            }
            return mmSdk.getProvider() || window.ethereum || null;
        }

        async function accessWithWallet() {
            errorBox.classList.add('hidden');
            showSigning(true);
            setStep('Opening wallet...');

            try {
                if (typeof ethers === 'undefined') {
                    throw new Error('Wallet library failed to load.');
                }

                const rawProvider = await getWalletProvider();
                if (!rawProvider) {
                    throw new Error('NO_WALLET');
                }

                setStep('Requesting account...');
                const web3 = new ethers.providers.Web3Provider(rawProvider, 'any');
                await web3.send('eth_requestAccounts', []);
                const signer = web3.getSigner();
                const address = await signer.getAddress();
                if (!address) throw new Error('No wallet account detected.');

                setStep('Sign the verification');
                const issued = new Date().toISOString();
                const message = [
                    'MuzzSnap Login',
                    '',
                    'Sign this message to verify your wallet.',
                    'You will continue in this browser after signing.',
                    '',
                    'Wallet: ' + address,
                    'Issued: ' + issued
                ].join('\n');

                const signature = await signer.signMessage(message);
                const recovered = ethers.utils.verifyMessage(message, signature);
                if (normalizeAddress(recovered) !== normalizeAddress(address)) {
                    throw new Error('Signature does not match this wallet.');
                }

                saveUserSession(address);
                sessionStorage.setItem('muzz_login_sig', signature);
                sessionStorage.setItem('muzz_login_msg', message);
                setStep('Verified. Entering chat...');
                window.location.href = 'chat.html';
            } catch (err) {
                const msg = (err && (err.message || err.reason)) ? String(err.message || err.reason) : 'Connection rejected.';
                if (msg === 'NO_WALLET' || /no provider|sdk/i.test(msg)) {
                    showError('NO_WALLET', 'Install MetaMask, then return to this tab and tap the logo again. The app will ask you to sign, without leaving this browser.');
                    return;
                }
                if (/rejected|denied|cancel/i.test(msg)) {
                    showError('SIGNATURE REQUIRED', 'Wallet connection or signature was rejected.');
                    return;
                }
                showError('AUTH_FAILED', msg);
            }
        }

        function accessWithGuest() {
            const user = document.getElementById('usernameInput').value.trim();
            if (!user) {
                showError('REQUIRED', 'Enter a nickname.');
                return;
            }

            sessionStorage.setItem('muzz_wallet_address', `guest_${user}`);
            sessionStorage.setItem('muzz_user_role', 'guest');
            sessionStorage.setItem('muzz_is_admin', 'false');
            window.location.href = 'chat.html';
        }

        document.getElementById('usernameInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') accessWithGuest();
        });
    </script>
</body>
</html>
