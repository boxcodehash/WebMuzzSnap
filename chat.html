<body class="dark-theme">
  <div class="space-grid"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase (pulsari) and the session contract live in muzz-session.js (shared by the root pages).
    MuzzSession.init();
    MuzzSession.proxyAppApi(); // /api/translate through the same-origin rewrite
    const db = firebase.database();

    // Admin list, identity pairs and wallet check: muzz-session.js (same 4 wallets as MuzzNames / the rules).
    const WALLET_UID = MuzzSession.WALLET_UID;
    const adminOf = MuzzSession.adminOf;
    const identityFor = MuzzSession.identityFor;
    const ADMIN_ROLES = MuzzSession.ADMIN_ROLES;
    const PRIVATE_GATE = {
      tokenAddress: '0xef3dAa5fDa8Ad7aabFF4658f1F78061fd626B8f0',
      minRequired: 2000000
    };
    const ERC20_ABI = [
      'function balanceOf(address) view returns (uint256)',
      'function decimals() view returns (uint8)'
    ];

    // Stickers: a message stores [[sticker:<id>]]; both MuzzSnap chats draw the SVG (js/stickers.js).
    const STICKER_TAB = 'MUZZ';
    const stickerList = () => (window.MuzzStickers && window.MuzzStickers.list) || [];
    const isStickerOnly = (text) => (window.MuzzStickers ? window.MuzzStickers.only(text) : false);
    const renderContent = (text) => {
      const raw = String(text || '');
      const out = [];
      const re = /\[\[sticker:([a-z0-9-]+)\]\]/g;
      let last = 0; let m; let n = 0;
      while ((m = re.exec(raw))) {
        if (m.index > last) out.push(raw.slice(last, m.index));
        const st = stickerList().find((x) => x.id === m[1]);
        out.push(st ? <img key={'st-' + (n++)} className="muzz-sticker" src={st.src} alt={st.label} /> : m[0]);
        last = m.index + m[0].length;
      }
      if (last < raw.length) out.push(raw.slice(last));
      return out;
    };

    const EMOJIS = {
      FACES:["😊","😂","😉","😍","😘","😛","😅","😢","😭","😠","😈","👽","🤖","🤡","💀","👻","💩"],
      HANDS:["👍","👎","👌","✌️","👏","👋","🙏","💪","☝️","🖖"],
      OBJECTS:["❤️","⭐","🔥","📚","💻","📱","📷","🔑","🔒","💡","💰","💎"],
      NATURE:["☀️","☁️","🌈","🌳","🌸","🌵","🐱","🐶","🦁","🦄","🐉","🐍"],
      FOOD:["🍕","🍔","🌮","🍣","🍰","🍦","☕","🍺","🍷","🍸"],
      ACTIVITIES:["⚽","🏀","🎾","🎵","🎸","🎮","♟️","🎨","🎬"]
    };

    const CHANNELS = [
      { id:"general", name:"GENERAL" }
    ];
    const ONLINE_TTL_MS = 45000;

    const liveOnlineList = (raw) => {
      const now = Date.now();
      const map = new Map();
      Object.values(raw || {}).forEach((user) => {
        if (!user || typeof user !== 'object') return;
        const seen = Number(user.lastSeen || 0);
        if (!seen || now - seen > ONLINE_TTL_MS) return;
        if (user.online === false) return;
        const key = user.identityKey || user.wallet || user.uid;
        if (!key) return;
        const prev = map.get(key);
        if (!prev || seen >= Number(prev.lastSeen || 0)) map.set(key, user);
      });
      return Array.from(map.values()).sort((a, b) => String(a.username || '').localeCompare(String(b.username || '')));
    };

    const pinPathForChannel = (channelId) => `settings/pinned/${channelId}`;

    function App(){
      const [me, setMe] = useState(null);
      const [messages, setMessages] = useState([]);
      const [onlineUsers, setOnlineUsers] = useState([]);
      const [mutedMap, setMutedMap] = useState({});
      const [pinnedMessage, setPinnedMessage] = useState("");
      const [messageText, setMessageText] = useState("");
      const [darkMode, setDarkMode] = useState(true);
      const [showEmoji, setShowEmoji] = useState(false);
      const [emojiTab, setEmojiTab] = useState("FACES");
      const [showTranslate, setShowTranslate] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [undoText, setUndoText] = useState(null);
      const [activeChannel, setActiveChannel] = useState(CHANNELS[0]);
      const [mobileMenu, setMobileMenu] = useState(false);
      const menuRef = useRef(null);
      // Same line as the app menu. The web root has no FCM client, so without window.MuzzPush it shows the browser permission and 'no token'.
      const webPushLine = () => {
        let perm = 'not granted';
        try { if (window.Notification && Notification.permission === 'granted') perm = 'granted'; } catch {}
        return 'Notifications ' + perm + ' · no token';
      };
      const [pushStatus, setPushStatus] = useState(webPushLine);

      useEffect(() => {
        const apply = () => setPushStatus(window.MuzzPush && MuzzPush.statusLine ? MuzzPush.statusLine() : webPushLine());
        apply();
        window.addEventListener('muzz-push-status', apply);
        return () => window.removeEventListener('muzz-push-status', apply);
      }, []);

      useEffect(() => {
        if (!mobileMenu) return undefined;
        const onKey = (e) => { if (e.key === 'Escape') setMobileMenu(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [mobileMenu]);

      useEffect(() => {
        /* Phone/tablet: the drawer is off-screen when closed, so keep it out of the Tab order and the screen reader.
           Desktop (>=1024px) shows the menu all the time. */
        const el = menuRef.current;
        if (!el) return;
        const drawer = window.matchMedia ? window.matchMedia('(max-width: 1023px)').matches : false;
        el.inert = drawer && !mobileMenu;
        if (drawer && !mobileMenu) el.setAttribute('aria-hidden', 'true');
        else el.removeAttribute('aria-hidden');
      });
      const [pinMode, setPinMode] = useState(false);
      const [banPanel, setBanPanel] = useState(false);
      const [mutePanel, setMutePanel] = useState(false);
      const [notice, setNotice] = useState({show:false,title:"",desc:"",tone:"red"});
      const [nowTick, setNowTick] = useState(Date.now());
      const bottomRef = useRef(null);
      const presenceRawRef = useRef({});

      const toggleTheme = () => {
        setDarkMode((prev) => {
          const next = !prev;
          document.body.className = next ? 'dark-theme' : 'light-theme';
          return next;
        });
      };

      const isAdmin = !!me && ADMIN_ROLES.includes(me.role);
      const mutedUntilForMe = me?.identityKey ? mutedMap[me.identityKey] : null;
      const iAmMuted = !!(mutedUntilForMe && mutedUntilForMe > Date.now());

      const showNotice = (title, desc, tone='red') => setNotice({show:true,title,desc,tone});
      const closeNotice = () => setNotice({show:false,title:"",desc:"",tone:"red"});

      const roleClass = (role, fallback='text-gray-400') => {
        if (role === 'ryachu') return 'ryachu-name';
        if (role === 'itsuki') return 'itsuki-name';
        if (role === 'esteban') return 'esteban-name';
        if (role === 'admin') return 'admin-name';
        return fallback;
      };

      const roleBadge = (role) => {
        if (role === 'ryachu') return '👑 ';
        if (role === 'itsuki') return '💎 ';
        if (role === 'esteban') return '🛡️ ';
        if (role === 'admin') return '⚡ ';
        return '';
      };

      // ◆ = verified MuzzID (non-admin, not Node_); label = admin name / MuzzID (+ tail) / Node_xxxx.
      const muzzBadge = (u) => (u && MuzzSession.isMuzzIdName(u.username, u.role, u.wallet || u.userId)
        ? <span className="muzzid-badge" title={`MuzzID NFT · ${String(u.wallet || u.userId || '').slice(0, 6)}…${String(u.wallet || u.userId || '').slice(-4)}`} aria-label="MuzzID">◆ </span>
        : null);
      const labelOf = (u) => {
        const w = (u && (u.wallet || u.userId)) || '';
        return /^0x[a-fA-F0-9]{40}$/.test(String(w)) ? MuzzSession.labelFor(w, u.username, u.role) : ((u && u.username) || '');
      };

      const requireAdmin = () => {
        if (!isAdmin) {
          alert('Admin only.');
          return false;
        }
        return true;
      };

      useEffect(() => {
        let statusRef = null;
        let statusListRef = null;
        let bannedRef = null;
        let mutedRef = null;
        let connectedRef = null;
        let stopRefresh = null;

        let cancelled = false;
        const startSession = async (user) => {
          const wallet = user.uid;
          // Admin pair, else the MuzzID from the server-signed token (muzzidUntil valid), else Node_ + last 4.
          const { username, role } = await MuzzSession.identityWithMuzzId(wallet, firebase.auth());
          if (cancelled) return;
          const identityKey = 'wallet_' + wallet;
          const currentUser = {
            uid: user.uid,
            username,
            role,
            isWallet: true,
            wallet,
            identityKey
          };
          setMe(currentUser);

          // Presence on status/{uid} (rules: $id == auth.uid)
          statusRef = db.ref(`status/${user.uid}`);
          const writePresence = () => {
            statusRef.update({
              uid: user.uid,
              username,
              role,
              wallet,
              identityKey,
              lastSeen: Date.now(),
              online: true
            }).catch((err) => console.warn('presence write failed', err));
          };

          connectedRef = db.ref('.info/connected');
          connectedRef.on('value', (snap) => {
            if (snap.val() !== true) return;
            // Only clear online/lastSeen on disconnect
            statusRef.child('online').onDisconnect().set(false);
            statusRef.child('lastSeen').onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
            writePresence();
          });

          const beat = setInterval(writePresence, 20000);
          statusRef._beat = beat;

          statusListRef = db.ref('status');
          statusListRef.on('value', (snap) => {
            presenceRawRef.current = snap.val() || {};
            setOnlineUsers(liveOnlineList(presenceRawRef.current));
          });

          mutedRef = db.ref('muted');
          mutedRef.on('value', (snap) => setMutedMap(snap.val() || {}));

          bannedRef = db.ref(`banned/${identityKey}`);
          bannedRef.on('value', (snap) => {
            if (snap.val()) {
              MuzzSession.endSession('banned');
            }
          });

          stopRefresh = MuzzSession.startRefresh();
        };

        // Wait for the Firebase session that login.html created (muzz-session.js gate).
        const unsubAuth = MuzzSession.gate(startSession);

        return () => {
          cancelled = true;
          try { if (statusRef && statusRef._beat) clearInterval(statusRef._beat); } catch {}
          try {
            if (statusRef) {
              statusRef.child('online').set(false);
              statusRef.child('lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
              statusRef.off();
            }
          } catch {}
          try { if (statusListRef) statusListRef.off(); } catch {}
          try { if (bannedRef) bannedRef.off(); } catch {}
          try { if (mutedRef) mutedRef.off(); } catch {}
          try { if (connectedRef) connectedRef.off(); } catch {}
          try { if (stopRefresh) stopRefresh(); } catch {}
          try { unsubAuth(); } catch {}
        };
      }, []);

      useEffect(() => {
        const tick = setInterval(() => {
          setNowTick(Date.now());
          setOnlineUsers(liveOnlineList(presenceRawRef.current));
        }, 10000);
        return () => clearInterval(tick);
      }, []);

      useEffect(() => {
        if (!me) return;
        const pinRef = db.ref(pinPathForChannel(activeChannel.id));
        pinRef.on('value', (snap) => setPinnedMessage(snap.val() || ""));
        return () => pinRef.off();
      }, [me, activeChannel]);

      useEffect(() => {
        if (!me) return;
        const ref = db.ref(`messages/${activeChannel.id}`).limitToLast(50);
        ref.on('value', (snap) => {
          const data = snap.val() || {};
          setMessages(Object.keys(data).map((id) => ({ id, ...data[id] })).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)));
        }, (err) => console.error('messages listen error', err));

        return () => {
          try { ref.off(); } catch {}
        };
      }, [me, activeChannel]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior:'smooth' });
      }, [messages]);

      useEffect(() => {
        const apply = () => {
          const vv = window.visualViewport;
          const h = Math.round(vv ? vv.height : window.innerHeight);
          const top = Math.round(vv ? vv.offsetTop : 0);
          document.documentElement.style.setProperty('--app-h', h + 'px');
          document.documentElement.style.setProperty('--app-top', top + 'px');
        };
        apply();
        const onKeyboard = () => {
          apply();
          bottomRef.current?.scrollIntoView({ block: 'end' });
        };
        window.visualViewport?.addEventListener('resize', onKeyboard);
        window.visualViewport?.addEventListener('scroll', apply);
        window.addEventListener('orientationchange', apply);
        return () => {
          window.visualViewport?.removeEventListener('resize', onKeyboard);
          window.visualViewport?.removeEventListener('scroll', apply);
          window.removeEventListener('orientationchange', apply);
        };
      }, []);

      const goToPrivate = async () => {
        if (!me) return;

        if (ADMIN_ROLES.includes(me.role)) {
          window.location.href = 'private.html';
          return;
        }

        if (!me.isWallet) {
          showNotice('WALLET REQUIRED', 'MUZZ PRIVATE is only available for users logged in with a crypto wallet.', 'yellow');
          return;
        }

        const walletAddress = me.wallet;
        if (!walletAddress || !WALLET_UID.test(walletAddress)) {
          showNotice('WALLET REQUIRED', 'You must sign in with a crypto wallet to access MUZZ PRIVATE.', 'yellow');
          return;
        }

        if (typeof window.ethereum === 'undefined' || typeof ethers === 'undefined') {
          showNotice('WEB3 REQUIRED', 'No Web3 wallet was detected. Please open the site with MetaMask or another wallet-enabled browser.', 'yellow');
          return;
        }

        try {
          showNotice('VERIFYING ACCESS', 'Checking your MUZZ token balance for private access...', 'blue');
          const chainId = await window.ethereum.request({ method:'eth_chainId' });

          if (chainId !== '0x1') {
            try {
              await window.ethereum.request({
                method:'wallet_switchEthereumChain',
                params:[{ chainId:'0x1' }]
              });
            } catch {
              showNotice('WRONG NETWORK', 'Please switch to Ethereum Mainnet to validate your MUZZ balance.', 'yellow');
              return;
            }
          }

          const provider = new ethers.providers.Web3Provider(window.ethereum);
          const token = new ethers.Contract(PRIVATE_GATE.tokenAddress, ERC20_ABI, provider);
          const [rawBalance, decimals] = await Promise.all([
            token.balanceOf(walletAddress),
            token.decimals()
          ]);

          const formattedBalance = parseFloat(ethers.utils.formatUnits(rawBalance, decimals));
          if (formattedBalance >= PRIVATE_GATE.minRequired) {
            window.location.href = 'private.html';
            return;
          }

          showNotice(
            'INSUFFICIENT MUZZ BALANCE',
            `Access to MUZZ PRIVATE requires at least 2,000,000 MUZZ tokens. Your current balance is ${formattedBalance.toLocaleString(undefined,{maximumFractionDigits:2})} MUZZ.`,
            'red'
          );
        } catch (err) {
          console.error('Private access check failed:', err);
          showNotice('VERIFICATION ERROR', 'Your MUZZ balance could not be verified. Please reopen your wallet and try again.', 'red');
        }
      };

      const sendMessage = async () => {
        if (!messageText.trim() || !me) return;
        if (iAmMuted) {
          alert('You are muted for a moment.');
          return;
        }

        const text = messageText.trim();

        try {
          if (pinMode) {
            if (!requireAdmin()) return;
            if (!text || text.length > 500) {
              alert('Pinned messages must be 1 to 500 characters.');
              return;
            }
            await db.ref(pinPathForChannel(activeChannel.id)).set(text);
            setPinMode(false);
            setMessageText(''); setUndoText(null);
            alert('Pinned message updated.');
            return;
          }

          if (!text || text.length > 4000) {
            alert('Messages must be 1 to 4000 characters.');
            return;
          }
          // Exactly what the RTDB rules validate: wallet/userId = uid, identityKey = 'wallet_' + uid,
          // username/role = the pair for this wallet, content 1..4000, numeric timestamp.
          const payload = {
            content: text,
            username: me.username,
            role: me.role,
            userId: me.uid,
            identityKey: me.identityKey,
            wallet: me.uid,
            timestamp: Date.now()
          };
          await db.ref(`messages/${activeChannel.id}`).push(payload);

          setMessageText(''); setUndoText(null);
          setShowEmoji(false);
        } catch (err) {
          console.error('send message failed:', err);
          alert('Could not send the message. Try again.');
        }
      };

      const adminActions = {
        enablePinMode: () => {
          if (!requireAdmin()) return;
          setMobileMenu(false);
          setPinMode(true);
          setMessageText(''); setUndoText(null);
        },
        clearChat: async () => {
          if (!requireAdmin()) return;
          setMobileMenu(false);
          if (!confirm('Clear the whole chat history?')) return;
          try {
            await db.ref(`messages/${activeChannel.id}`).set(null);
            setMessages([]);
            alert('Public chat cleared successfully.');
          } catch (err) {
            console.error('clearChat failed:', err);
            alert(`Could not clear this chat: ${err.message || err}`);
          }
        },
        removePin: async () => {
          if (!requireAdmin()) return;
          try {
            await db.ref(pinPathForChannel(activeChannel.id)).remove();
            alert('Pinned message removed.');
          } catch (err) {
            console.error('removePin failed:', err);
            alert(`Could not remove pinned message: ${err.message || err}`);
          }
        },
        openBanPanel: () => {
          if (!requireAdmin()) return;
          setMobileMenu(false);
          setBanPanel(true);
        },
        openMutePanel: () => {
          if (!requireAdmin()) return;
          setMobileMenu(false);
          setMutePanel(true);
        },
        banUser: async (target) => {
          if (!requireAdmin()) return;
          if (!target?.identityKey) {
            alert('This user has no stable identity key.');
            return;
          }
          if (!confirm(`Ban ${target.username} permanently?`)) {
            setBanPanel(false);
            return;
          }
          try {
            if (!WALLET_UID.test(String(target.uid || ''))) { alert('This user cannot be banned: no wallet session.'); return; }
            // Key from the uid (status/{uid} key = auth.uid), never from the node's own identityKey field.
            await db.ref(`banned/wallet_${target.uid}`).set({
              username: target.username,
              role: target.role || 'user',
              uid: target.uid || null,
              wallet: target.wallet || null,
              bannedAt: Date.now(),
              bannedBy: me?.username || 'admin'
            });
            // Best effort: the rules only let a user remove their own status node, so this is denied.
            if (target.uid) db.ref(`status/${target.uid}`).remove().catch(() => {});
            alert(`${target.username} has been banned.`);
          } catch (err) {
            console.error('banUser failed:', err);
            alert(`Could not ban user: ${err.message || err}`);
          }
          setBanPanel(false);
        },
        muteUser: async (target) => {
          if (!requireAdmin()) return;
          if (!target?.identityKey) {
            alert('This user has no stable identity key.');
            return;
          }
          try {
            if (!WALLET_UID.test(String(target.uid || ''))) { alert('This user cannot be muted: no wallet session.'); return; }
            await db.ref(`muted/wallet_${target.uid}`).set(Date.now() + 60000);
            alert(`${target.username} has been muted for 1 minute.`);
          } catch (err) {
            console.error('muteUser failed:', err);
            alert(`Could not mute user: ${err.message || err}`);
          }
          setMutePanel(false);
        }
      };

      if (!me) {
        return (
          <div className="boot-screen">
            <img src="muzzsnap.jpg" alt="MuzzSnap" className="boot-logo" />
            <p className="boot-text">CONNECTING</p>
          </div>
        );
      }

      return (
        <div className="app-shell">
          <aside id="muzzMenu" ref={menuRef} aria-label="Menu" className={`sidebar panel-3d orbit-panel mm ${mobileMenu ? 'open' : ''}`}>
            <header className="mm-head">
              <img src="muzzsnap.jpg" alt="MuzzSnap" className="mm-logo" />
              <div className="min-w-0 flex-1">
                <h1 className="mm-title">MUZZ<span>SNAP</span></h1>
                <p className="mm-me truncate">{me.username}</p>
              </div>
              <button type="button" className="mm-x lg:hidden" onClick={() => setMobileMenu(false)} aria-label="Close menu">
                <i className="fas fa-times" aria-hidden="true"></i>
              </button>
            </header>

            <nav className="mm-body custom-scroll" aria-label="Chat menu">
              {me && !isAdmin && (
                <div className="mm-pick" ref={(el) => {
                  if (el && !el.dataset.mounted) {
                    el.dataset.mounted = '1';
                    MuzzSession.mountPicker(el, firebase.auth(), () => window.location.reload());
                  }
                }}></div>
              )}
              <p className="mm-label">Chat</p>
              {CHANNELS.map((channel) => (
                <button
                  key={channel.id}
                  type="button"
                  aria-current={activeChannel.id === channel.id ? 'page' : undefined}
                  onClick={() => { setActiveChannel(channel); setMobileMenu(false); }}
                  className={`mm-item ${activeChannel.id === channel.id ? 'active' : ''}`}
                >
                  <i className="fas fa-hashtag" aria-hidden="true"></i><span>{channel.name.charAt(0) + channel.name.slice(1).toLowerCase()}</span>
                </button>
              ))}

              <p className="mm-label">Rooms</p>
              <button type="button" onClick={() => { setMobileMenu(false); goToPrivate(); }} className="mm-item">
                <i className={`fas ${me.isWallet ? 'fa-user-secret' : 'fa-lock'}`} aria-hidden="true"></i>
                <span>Private</span><small>Wallet-verified · Encrypted</small>
              </button>
              <button type="button" id="btnMuzzId" className="mm-item" aria-haspopup="dialog"
                onClick={(event) => { if (window.MuzzIdTestnet) window.MuzzIdTestnet.open(event.currentTarget); }}>
                <i className="fas fa-id-card" aria-hidden="true"></i>
                <span>{(window.MuzzIdTestnet && MuzzIdTestnet.TEXT.button) || 'MuzzID'}</span>
                <small>{(window.MuzzIdTestnet && MuzzIdTestnet.TEXT.buttonHint) || ''}</small>
              </button>

              {isAdmin && (
                <>
                  <p className="mm-label mm-label-admin">Admin</p>
                  <div className="mm-admin admin-row" role="group" aria-label="Admin actions">
                    <button type="button" onClick={adminActions.enablePinMode} className="mm-chip" title="Pin a message" aria-label="Pin message"><i className="fas fa-thumbtack" aria-hidden="true"></i><span>Pin</span></button>
                    <button type="button" onClick={adminActions.clearChat} className="mm-chip" title="Clear chat" aria-label="Clear chat"><i className="fas fa-trash" aria-hidden="true"></i><span>Clear</span></button>
                    <button type="button" onClick={adminActions.openBanPanel} className="mm-chip" title="Ban a user" aria-label="Ban user"><i className="fas fa-user-slash" aria-hidden="true"></i><span>Ban</span></button>
                    <button type="button" onClick={adminActions.openMutePanel} className="mm-chip" title="Mute a user for 1 minute" aria-label="Mute user 1 minute"><i className="fas fa-volume-mute" aria-hidden="true"></i><span>Mute</span></button>
                  </div>
                </>
              )}

              <p className="mm-label">Online · {onlineUsers.length}</p>
              <ul className="mm-online">
                {onlineUsers.length === 0 && (<li className="mm-empty">Nobody online</li>)}
                {onlineUsers.map((user, idx) => (
                  <li key={`${user.identityKey || user.uid || idx}`}>
                    <span className="online-dot" aria-hidden="true"></span>
                    <span className={`truncate ${roleClass(user.role,'text-gray-400')}`}>{roleBadge(user.role)}{muzzBadge(user)}{labelOf(user)}</span>
                  </li>
                ))}
              </ul>
            </nav>

            <footer className="mm-foot">
              <p id="muzzPushStatus" data-react="1" role="status" className="mm-status">{pushStatus}</p>
              <div className="mm-foot-row">
                <span></span>
                <button
                  type="button"
                  onClick={() => {
                    try {
                      if (me?.uid) {
                        db.ref(`status/${me.uid}/online`).set(false);
                        db.ref(`status/${me.uid}/lastSeen`).set(Date.now());
                      }
                    } catch {}
                    MuzzSession.disconnect();
                  }}
                  className="mm-out"
                  aria-label="Disconnect"
                >
                  <i className="fas fa-power-off" aria-hidden="true"></i>Disconnect
                </button>
              </div>
            </footer>
          </aside>

          <main className="panel-3d flex-1 min-w-0 relative">
            {pinnedMessage && (
              <div className="bg-red-600/10 border-b border-red-600/30 py-2 px-3 md:px-5 flex items-center gap-3 flex-shrink-0">
                <i className="fas fa-thumbtack text-red-600 text-[10px]"></i>
                <div className="text-[11px] font-bold tracking-[0.14em] text-red-500 uppercase flex-1 truncate">{pinnedMessage}</div>
                {isAdmin && (
                  <button onClick={adminActions.removePin} className="text-red-400 hover:text-red-600 px-2">
                    <i className="fas fa-times"></i>
                  </button>
                )}
              </div>
            )}

            <header className="chat-header h-14 md:h-16 flex items-center justify-between px-3 md:px-5 flex-shrink-0" style={{boxShadow:'inset 0 -1px 0 rgba(255,255,255,0.06)'}}>
              <div className="flex items-center gap-3 min-w-0">
                <button type="button" onClick={() => setMobileMenu(true)} className="icon-btn lg:hidden" aria-label="Open menu">
                  <i className="fas fa-bars"></i>
                </button>
                <img src="muzzsnap.jpg" alt="" className="header-logo" />
                <div className="min-w-0">
                  <h2 className="text-xs md:text-sm font-black tracking-[0.18em] text-red-500 uppercase truncate">/ {activeChannel.name}</h2>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <div className="online-count" title="Connected now">{onlineUsers.length}</div>
                <button type="button" onClick={toggleTheme} className="icon-btn" aria-label="Toggle theme">
                  {darkMode ? <i className="fas fa-sun text-yellow-400"></i> : <i className="fas fa-moon text-blue-500"></i>}
                </button>
              </div>
            </header>

            <div className="msg-list flex-1 min-h-0 overflow-y-auto px-3 py-4 md:px-6 md:py-6 flex flex-col gap-4 custom-scroll">
              {messages.map((msg, index) => {
                const muted = !!(msg.identityKey && mutedMap[msg.identityKey] && mutedMap[msg.identityKey] > Date.now());
                const date = new Date(msg.timestamp);
                const prev = index > 0 ? messages[index - 1] : null;
                const prevDate = prev ? new Date(prev.timestamp) : null;
                const showDay = !prevDate || date.toDateString() !== prevDate.toDateString();

                const formatDay = (d) => {
                  const now = new Date();
                  const yesterday = new Date(now);
                  yesterday.setDate(yesterday.getDate() - 1);
                  if (d.toDateString() === now.toDateString()) return 'TODAY';
                  if (d.toDateString() === yesterday.toDateString()) return 'YESTERDAY';
                  return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).toUpperCase();
                };

                return (
                  <React.Fragment key={msg.id}>
                    {showDay && (
                      <div className="flex items-center gap-3 my-2">
                        <div className="flex-1 h-px bg-gradient-to-r from-transparent via-red-600/30 to-transparent"></div>
                        <span className="text-[9px] font-black tracking-[0.22em] text-red-500/80 px-3 py-1 rounded-full" style={{boxShadow:'inset 0 0 0 1px rgba(255,0,0,0.2)'}}>{formatDay(date)}</span>
                        <div className="flex-1 h-px bg-gradient-to-r from-red-600/30 via-transparent to-transparent"></div>
                      </div>
                    )}

                    <div className={`flex flex-col ${msg.userId === me.uid ? 'items-end' : 'items-start'}`}>
                      <span className={`text-[10px] font-black mb-1 uppercase px-1 ${roleClass(msg.role,'text-gray-500')}`}>
                        {roleBadge(msg.role)}{muzzBadge(msg)}{labelOf(msg)} {muted && '🔇'}
                      </span>
                      <div className={`bubble-3d ${msg.userId === me.uid ? 'me' : 'other'} ${muted ? 'muted' : ''} ${isStickerOnly(msg.content) ? 'muzz-sticker-only' : ''}`}>
                        {renderContent(msg.content)}
                      </div>
                      <span className="msg-time">
                        {isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </span>
                    </div>
                  </React.Fragment>
                );
              })}
              <div ref={bottomRef}></div>
            </div>

            <div className={`composer flex-shrink-0 ${darkMode ? 'bg-black/30' : 'bg-gray-50'}`} style={{boxShadow:'inset 0 1px 0 rgba(255,255,255,0.06)'}}>
              {notice.show && (
                <div className={`mb-3 px-3 py-3 rounded-xl text-xs ${notice.tone === 'blue' ? 'bg-cyan-500/10 text-cyan-300' : notice.tone === 'yellow' ? 'bg-yellow-500/10 text-yellow-300' : 'bg-red-600/10 text-red-300'}`} style={{boxShadow:'inset 0 0 0 1px rgba(255,255,255,0.08)'}}>
                  <div className="flex items-start gap-3">
                    <i className={`fas ${notice.tone === 'blue' ? 'fa-shield-alt' : notice.tone === 'yellow' ? 'fa-lock' : 'fa-ban'} mt-0.5`}></i>
                    <div className="flex-1 min-w-0">
                      <p className="font-black uppercase tracking-wider mb-1">{notice.title}</p>
                      <p className="leading-relaxed">{notice.desc}</p>
                    </div>
                    <button onClick={closeNotice} className="opacity-70 px-1"><i className="fas fa-times"></i></button>
                  </div>
                </div>
              )}

              {pinMode && (
                <div className="mb-3 px-3 py-2 rounded-lg text-yellow-500 text-xs font-bold flex items-center gap-2" style={{background:'rgba(234,179,8,0.1)'}}>
                  <i className="fas fa-thumbtack"></i>
                  <span className="flex-1">PIN MODE — type and send</span>
                  <button onClick={() => setPinMode(false)}><i className="fas fa-times"></i></button>
                </div>
              )}

              {banPanel && (
                <div className="mb-3 rounded-xl p-3 max-h-40 overflow-y-auto custom-scroll" style={{boxShadow:'inset 0 0 0 1px rgba(255,0,0,0.3)'}}>
                  <div className="flex justify-between items-center mb-2">
                    <p className="text-xs font-bold text-red-500 uppercase">Ban user</p>
                    <button onClick={() => setBanPanel(false)}><i className="fas fa-times"></i></button>
                  </div>
                  {onlineUsers.filter((user) => !ADMIN_ROLES.includes(user.role)).map((user) => (
                    <button key={user.uid} onClick={() => adminActions.banUser(user)} className="w-full text-left px-3 py-2 text-xs rounded mb-1 flex items-center gap-2">
                      <i className="fas fa-user-slash text-red-500"></i>
                      <span className="font-bold">{user.username}</span>
                    </button>
                  ))}
                </div>
              )}

              {mutePanel && (
                <div className="mb-3 rounded-xl p-3 max-h-40 overflow-y-auto custom-scroll" style={{boxShadow:'inset 0 0 0 1px rgba(234,179,8,0.3)'}}>
                  <div className="flex justify-between items-center mb-2">
                    <p className="text-xs font-bold text-yellow-500 uppercase">Mute user</p>
                    <button onClick={() => setMutePanel(false)}><i className="fas fa-times"></i></button>
                  </div>
                  {onlineUsers.filter((user) => !ADMIN_ROLES.includes(user.role)).map((user) => (
                    <button key={user.uid} onClick={() => adminActions.muteUser(user)} className="w-full text-left px-3 py-2 text-xs rounded mb-1 flex items-center gap-2">
                      <i className="fas fa-volume-mute text-yellow-500"></i>
                      <span className="font-bold">{user.username}</span>
                    </button>
                  ))}
                </div>
              )}

              {showEmoji && (
                <div className="mb-3 rounded-xl overflow-hidden" style={{boxShadow:'inset 0 0 0 1px rgba(255,0,0,0.2)'}}>
                  <div className="flex overflow-x-auto custom-scroll">
                    {Object.keys(EMOJIS).concat(stickerList().length ? [STICKER_TAB] : []).map((tab) => (
                      <button key={tab} onClick={() => setEmojiTab(tab)} className={`px-3 py-2 text-[10px] font-black uppercase whitespace-nowrap ${emojiTab === tab ? 'text-red-500' : 'text-gray-500'}`}>
                        {tab}
                      </button>
                    ))}
                  </div>
                  {emojiTab === STICKER_TAB ? (
                    <div className="muzz-sticker-row custom-scroll">
                      {stickerList().map((sticker) => (
                        <button key={sticker.id} type="button" className="sticker-tile" onClick={() => setMessageText((prev) => prev + window.MuzzStickers.token(sticker.id))}>
                          <img src={sticker.src} alt="" />
                          <span>{sticker.label}</span>
                        </button>
                      ))}
                    </div>
                  ) : (
                  <div className="emoji-window custom-scroll">
                    {EMOJIS[emojiTab].map((emoji) => (
                      <span key={emoji} onClick={() => setMessageText((prev) => prev + emoji)} className="emoji-btn">{emoji}</span>
                    ))}
                  </div>
                  )}
                </div>
              )}

              {showTranslate && (
                <div className="muzz-translate-picker mb-3" role="listbox" aria-label="Translate to">
                  <p className="muzz-translate-label">Translate to</p>
                  {(window.MuzzTranslate ? window.MuzzTranslate.langs : []).map((lang) => (
                    <button
                      key={lang.id}
                      type="button"
                      data-lang={lang.id}
                      className={window.MuzzTranslate && window.MuzzTranslate.lastTarget() === lang.id ? 'is-on' : ''}
                      disabled={translating}
                      onClick={async () => {
                        const source = messageText;
                        if (!window.MuzzTranslate) return;
                        setTranslating(true);
                        try {
                          const out = await window.MuzzTranslate.translate(source, lang.id);
                          window.MuzzTranslate.remember(lang.id);
                          setUndoText((prev) => (prev == null ? source : prev));
                          setMessageText(out);
                          setShowTranslate(false);
                        } catch (err) {
                          window.MuzzTranslate.showError(err && err.message);
                        } finally {
                          setTranslating(false);
                        }
                      }}
                    >
                      {lang.label}
                    </button>
                  ))}
                </div>
              )}

              <div className="flex items-center gap-2 rounded-2xl px-3 py-2" style={{background:'rgba(0,0,0,0.28)', boxShadow:'inset 0 0 0 1px rgba(255,255,255,0.08)'}}>
                <button type="button" onClick={() => setShowEmoji((prev) => !prev)} className="text-gray-400 hover:text-red-500 px-1" aria-label="Emoji">
                  <i className="far fa-laugh-beam text-xl"></i>
                </button>
                <input
                  value={messageText}
                  onChange={(e) => setMessageText(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                  placeholder={iAmMuted ? 'You are muted...' : pinMode ? 'Message to pin...' : 'Write a message...'}
                  disabled={iAmMuted}
                  className="msg-input"
                />
                {undoText != null && (
                  <button type="button" className="muzz-translate-undo" onClick={() => { setMessageText(undoText); setUndoText(null); }}>Undo</button>
                )}
                {window.MuzzTranslate && (
                  <button type="button" className="muzz-translate-btn" aria-label="Translate" disabled={translating || iAmMuted} onClick={() => setShowTranslate((v) => !v)}>
                    <span aria-hidden="true">文A</span>
                  </button>
                )}
                <button type="button" onClick={sendMessage} className={`send-btn ${pinMode ? 'pin' : ''}`} aria-label="Send">
                  <i className={`fas ${pinMode ? 'fa-thumbtack' : 'fa-paper-plane'}`}></i>
                </button>
              </div>
            </div>
          </main>

          {mobileMenu && <div onClick={() => setMobileMenu(false)} className="drawer-backdrop lg:hidden"></div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
